schema_version: 1.0.0
use_case: UC2
contracts:
  - {contract_id: UC2-C01, producer: observer_adapter, consumer: association_service, payload: [event_id, interface, pseudonym, event_time], sensitivity: Critical, failure_behavior: mark observation missing, status: proposed}
  - {contract_id: UC2-C02, producer: association_service, consumer: classification_service, payload: [hypothesis_id, observation_ids, alternatives], sensitivity: Critical, failure_behavior: emit inconclusive classification, status: synthetic}
  - {contract_id: UC2-C03, producer: classification_service, consumer: detection_xai, payload: [predicted_class, confidence, alternatives], sensitivity: High, failure_behavior: no alert, status: synthetic}
  - {contract_id: UC2-C04, producer: approved_device_registry, consumer: detection_xai, payload: [hypothesis_id, approval_status, freshness], sensitivity: Critical, failure_behavior: return unknown and fail closed, status: proposed}
  - {contract_id: UC2-C05, producer: detection_xai, consumer: policy_service, payload: [alert_id, score, explanation], sensitivity: High, failure_behavior: audit without response, status: proposed}
  - {contract_id: UC2-C06, producer: digital_twin_service, consumer: T4.4, payload: [entity_id, version, state, freshness], sensitivity: High, failure_behavior: mark twin stale, status: proposed}
  - {contract_id: UC2-C07, producer: evidence_service, consumer: forensic_service, payload: [evidence_id, content_sha256, custody_id], sensitivity: Critical, failure_behavior: quarantine invalid evidence, status: proposed}
  - {contract_id: UC2-C08, producer: simulation, consumer: T4.5_WP6, payload: [run_manifest, metrics, competency_queries], sensitivity: Medium, failure_behavior: reject incomplete run, status: synthetic}
